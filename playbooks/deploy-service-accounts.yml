---
# playbooks/deploy-service-accounts.yml — Provision the "tradingo" and
# "rory" accounts across every login-gated service (Airflow, Grafana,
# Miniflux, MinIO).
#
# Passwords are generated once and persisted under tradingo-infra/.credentials/
# (gitignored) on the machine running ansible-playbook — re-runs are
# idempotent and reuse the same passwords.
#
# Usage:
#   ansible-playbook playbooks/deploy-service-accounts.yml
#   ansible-playbook playbooks/deploy-service-accounts.yml -e '{"service_accounts_targets":["grafana"]}'

- name: Provision tradingo/rory service accounts
  hosts: managers
  become: true
  roles:
    - service_accounts
