---
# playbooks/deploy-mcp-gateway.yml — Public HTTPS + OAuth gateway for the MCP servers
#
# Builds the gateway image on the manager, deploys it as the `mcp-gateway`
# stack, plus a Tailscale sidecar that joins the tailnet as `tradingo-mcps` and
# serves it over HTTPS with Funnel. Each MCP server becomes a Claude custom
# connector at:
#   https://tradingo-mcps.tailfe5b8d.ts.net/<name>/mcp     (tradingo, grafana, airflow, web-search)
# Sign-in is GitHub OAuth, limited to mcp_gateway_allowed_users. The host-level
# Funnel on nuc-05 is turned off, so nuc-05 itself is tailnet-only.
#
# Prerequisites (once):
#   - Tailnet: MagicDNS + HTTPS certificates on; auth key tagged
#     tag:tradingo-mcps with the `funnel` nodeAttr (see setup-mcp-gateway.yml).
#   - ansible-playbook playbooks/setup-mcp-gateway.yml   (OAuth + Tailscale secrets)
#   - grafana-mcp allows the gateway's Host header: make deploy-monitoring
#
# Usage:
#   ansible-playbook playbooks/deploy-mcp-gateway.yml
#   ansible-playbook playbooks/deploy-mcp-gateway.yml -e mcp_gateway_expose_docker=true
#   ansible-playbook playbooks/deploy-mcp-gateway.yml -e mcp_gateway_funnel=false   # tailnet only
#   ansible-playbook playbooks/deploy-mcp-gateway.yml -e mcp_gateway_state=absent   # tear down

- name: Deploy mcp-gateway
  hosts: managers
  become: true
  roles:
    - mcp_gateway
