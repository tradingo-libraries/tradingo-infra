---
all:
  children:
    # --- Swarm cluster (home LAN) ---
    swarm:
      vars:
        # Access path is chosen by `cluster_access` (default in group_vars/swarm.yml):
        #   tailscale (default) - direct over the tailnet via MagicDNS, no jump host
        #   wireguard           - LAN IPs via ProxyJump through nuc-05's WireGuard IP (backup)
        #   lan                 - LAN IPs directly, when on the home network
        ansible_host: "{{ inventory_hostname ~ '.' ~ tailscale_tailnet if cluster_access == 'tailscale' else static_ip }}"
        ansible_ssh_common_args: >-
          {{ '-o ProxyJump=admin@' ~ wg_manager_ip if cluster_access == 'wireguard' else '' }}
      children:
        managers:
          hosts:
            nuc-05:
              swarm_role: manager
              swarm_labels:
                role: manager
                node: nuc-05
                workload: platform
        workers:
          hosts:
            nuc-01:
              swarm_role: worker
              swarm_labels:
                role: worker
                node: nuc-01
                workload: compute
            nuc-02:
              swarm_role: worker
              swarm_labels:
                role: worker
                node: nuc-02
                workload: compute
            nuc-03:
              swarm_role: worker
              swarm_labels:
                role: worker
                node: nuc-03
                workload: compute
            nuc-04:
              swarm_role: worker
              swarm_labels:
                role: worker
                node: nuc-04
                workload: compute

    # --- NFS ---
    nfs_servers:
      hosts:
        nuc-01:
    nfs_clients:
      hosts:
        nuc-02:
        nuc-03:
        nuc-04:
        nuc-05:

    # --- WireGuard ---
    gateway:
      hosts:
        gateway:
          ansible_host: "{{ do_public_ip }}"
          ansible_user: "{{ do_ssh_user }}"
