---
# roles/service_accounts/tasks/secret.yml
# Mirrors each locally-generated password into a Docker Swarm secret
# (svc_<username>_password) so one-shot provisioning containers (Miniflux,
# MinIO) can read it without the value ever passing through ansible output.
# Create-if-missing only — these are stable login passwords, not rotated.

- name: "Check whether secret svc_{{ account.username }}_password exists"
  ansible.builtin.command:
    cmd: "docker secret inspect svc_{{ account.username }}_password"
  register: _svc_secret_check
  failed_when: false
  changed_when: false

- name: "Create secret svc_{{ account.username }}_password"
  ansible.builtin.shell:
    cmd: "printf '%s' {{ service_account_passwords[account.username] | quote }} | docker secret create svc_{{ account.username }}_password -"
  when: _svc_secret_check.rc != 0
  no_log: true
  changed_when: true
