---
# roles/service_accounts/tasks/grafana.yml
# Creates Grafana login users via the admin HTTP API (mirrors the existing
# mcp-client service-account pattern in roles/monitoring/tasks/main.yml).

- name: "Check whether Grafana account exists"
  ansible.builtin.uri:
    url: "http://localhost:3000/api/users/lookup?loginOrEmail={{ item.username }}"
    method: GET
    url_username: admin
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  loop: "{{ service_accounts }}"
  loop_control:
    label: "{{ item.username }}"
  register: _grafana_user_check
  check_mode: false

- name: "Create Grafana account"
  ansible.builtin.uri:
    url: "http://localhost:3000/api/admin/users"
    method: POST
    url_username: admin
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ item.item.first_name }} {{ item.item.last_name }}"
      login: "{{ item.item.username }}"
      email: "{{ item.item.email }}"
      password: "{{ service_account_passwords[item.item.username] }}"
    status_code: [200, 412]
  loop: "{{ _grafana_user_check.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  when: item.status == 404
  no_log: true
  changed_when: true

# --- Rotation: set the new password on existing rotated accounts, then prove it logs in ---

- name: "Reset Grafana account password (rotation)"
  ansible.builtin.uri:
    url: "http://localhost:3000/api/admin/users/{{ item.json.id }}/password"
    method: PUT
    url_username: admin
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ service_account_passwords[item.item.username] }}"
    status_code: [200]
  loop: "{{ _grafana_user_check.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  when:
    - item.item.username in _rotate_users
    - item.status == 200
  no_log: true
  changed_when: true

- name: "Verify new Grafana password works (GET /api/user)"
  ansible.builtin.uri:
    url: "http://localhost:3000/api/user"
    url_username: "{{ item }}"
    url_password: "{{ service_account_passwords[item] }}"
    force_basic_auth: true
    status_code: [200]
  loop: "{{ _rotate_users }}"
  register: _grafana_verify
  until: _grafana_verify.status == 200
  retries: 5
  delay: 3
  no_log: true
  changed_when: false

# --- Viewer service account + token for the tradingo `homepage` service ---
# The token lands straight in the grafana_homepage_token Docker secret (read by
# tradingo-plat/scripts/homepage). Create-if-missing: a secret in use by a
# service can't be replaced, so to rotate, remove the homepage service and the
# secret, then re-run this.

- name: "Check whether secret {{ grafana_homepage_secret }} exists"
  ansible.builtin.command:
    cmd: "docker secret inspect {{ grafana_homepage_secret }}"
  register: _homepage_secret_check
  failed_when: false
  changed_when: false

- name: "Ensure {{ grafana_homepage_account }} Grafana service account exists"
  ansible.builtin.uri:
    url: "http://localhost:3000/api/serviceaccounts"
    method: POST
    url_username: admin
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ grafana_homepage_account }}"
      role: Viewer
    status_code: [200, 201, 400, 409]
  register: _homepage_sa_create
  changed_when: _homepage_sa_create.status in [200, 201]

- name: "Mint token and store it as {{ grafana_homepage_secret }}"
  when: _homepage_secret_check.rc != 0
  block:
    - name: "Fetch {{ grafana_homepage_account }} service account"
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/search?query={{ grafana_homepage_account }}&limit=1"
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
      register: _homepage_sa

    - name: "List existing tokens for {{ grafana_homepage_account }}"
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/{{ _homepage_sa.json.serviceAccounts[0].id }}/tokens"
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
      register: _homepage_tokens

    - name: Delete orphaned homepage tokens (secret is missing, so nothing uses them)
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/{{ _homepage_sa.json.serviceAccounts[0].id }}/tokens/{{ item.id }}"
        method: DELETE
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: [200, 204]
      loop: "{{ _homepage_tokens.json | selectattr('name', 'equalto', grafana_homepage_account) | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Create {{ grafana_homepage_account }} token"
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/{{ _homepage_sa.json.serviceAccounts[0].id }}/tokens"
        method: POST
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ grafana_homepage_account }}"
        status_code: [200, 201]
      register: _homepage_token
      no_log: true

    - name: "Create secret {{ grafana_homepage_secret }}"
      ansible.builtin.shell:
        cmd: "printf '%s' {{ _homepage_token.json.key | quote }} | docker secret create {{ grafana_homepage_secret }} -"
      no_log: true
      changed_when: true
