---
# roles/docker_mcp/tasks/main.yml

- name: Remove docker-mcp stack
  when: docker_mcp_state == "absent"
  block:
    - name: Remove docker-mcp stack
      ansible.builtin.command: docker stack rm docker-mcp
      register: stack_rm
      failed_when: stack_rm.rc != 0 and 'not found' not in stack_rm.stderr
      changed_when: stack_rm.rc == 0

    - name: Remove config directory
      ansible.builtin.file:
        path: "{{ docker_mcp_config_dir }}"
        state: absent

- name: Deploy docker-mcp stack
  when: docker_mcp_state == "present"
  block:
    - name: Verify docker_mcp_access_token secret exists
      ansible.builtin.command: docker secret inspect docker_mcp_access_token
      register: secret_check
      changed_when: false
      failed_when: secret_check.rc != 0

    - name: Create config directory
      ansible.builtin.file:
        path: "{{ docker_mcp_config_dir }}"
        state: directory
        mode: "0755"

    - name: Template docker-mcp stack compose file
      ansible.builtin.template:
        src: docker-mcp-stack.yml.j2
        dest: "{{ docker_mcp_config_dir }}/docker-mcp-stack.yml"
        mode: "0644"

    - name: Deploy docker-mcp stack
      ansible.builtin.command:
        cmd: >
          docker stack deploy
          -c {{ docker_mcp_config_dir }}/docker-mcp-stack.yml
          docker-mcp
      changed_when: true

    - name: Wait for service to start
      ansible.builtin.command:
        cmd: docker stack services docker-mcp --format "{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.Replicas{{ '}}' }}"
      register: mcp_services
      changed_when: false

    - name: Show service status
      ansible.builtin.debug:
        msg: "{{ mcp_services.stdout_lines }}"
