---
registry_host: "192.168.0.50:5000"
registry_frontend_image: "joxit/docker-registry-ui:2.5.7"
registry_frontend_proxy: "http://registry:5000"
# Substrings the registry-frontend service spec must contain, else it is recreated.
registry_frontend_desired:
  - "{{ registry_frontend_image }}"
  - "NGINX_PROXY_PASS_URL={{ registry_frontend_proxy }}"
  - ingress
registry_ingress_port: 5001
