---
# roles/swarm_manager/tasks/main.yml

- name: Check if node is already in a swarm
  ansible.builtin.command: docker info --format '{{ '{{' }}.Swarm.LocalNodeState{{ '}}' }}'
  register: swarm_state
  changed_when: false

- name: Initialize Docker Swarm
  ansible.builtin.command: >
    docker swarm init --advertise-addr {{ static_ip }}
  when: swarm_state.stdout != "active"
  register: swarm_init

- name: Get worker join token
  ansible.builtin.command: docker swarm join-token -q worker
  register: worker_token
  changed_when: false

- name: Get manager join token
  ansible.builtin.command: docker swarm join-token -q manager
  register: manager_token
  changed_when: false

- name: Save tokens as facts
  ansible.builtin.set_fact:
    swarm_worker_token: "{{ worker_token.stdout }}"
    swarm_manager_token: "{{ manager_token.stdout }}"

- name: Create overlay networks
  ansible.builtin.command: >
    docker network create --driver overlay --attachable {{ item }}
  loop:
    - backend
    - monitoring
  register: net_result
  failed_when: net_result.rc != 0 and 'already exists' not in net_result.stderr
  changed_when: net_result.rc == 0

- name: Label manager node
  ansible.builtin.command: >
    docker node update
    {% for key, value in swarm_labels.items() %}
    --label-add {{ key }}={{ value }}
    {% endfor %}
    {{ hostname }}
  changed_when: false

# --- Docker Registry (infrastructure service, not part of app stack) ---

- name: Create registry config directory
  ansible.builtin.file:
    path: /etc/docker/registry
    state: directory
    mode: "0755"

- name: Template registry config
  ansible.builtin.template:
    src: registry-config.yml.j2
    dest: /etc/docker/registry/config.yml
    mode: "0644"
  register: registry_config

- name: Check if registry service exists
  ansible.builtin.command: docker service inspect registry
  register: registry_inspect
  changed_when: false
  failed_when: false

- name: Remove registry service (config changed)
  ansible.builtin.command: docker service rm registry
  when: registry_inspect.rc == 0 and registry_config.changed
  changed_when: true

- name: Create registry service
  ansible.builtin.command: >
    docker service create
    --name registry
    --network backend
    --publish published=5000,target=5000
    --env REGISTRY_HTTP_RELATIVEURLS=true
    --env REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR=inmemory
    --mount type=volume,source=registry-data,target=/var/lib/registry
    --mount type=bind,source=/etc/docker/registry/config.yml,target=/etc/docker/registry/config.yml,readonly
    --constraint 'node.hostname == nuc-01'
    --limit-memory 512M
    --restart-condition on-failure
    registry:2
  when: registry_inspect.rc != 0 or registry_config.changed
  changed_when: true

# Published in ingress mode (routing mesh) so nuc-05's `tailscale serve` can proxy
# https://registry.<tailnet> to 127.0.0.1:5000; 192.168.0.50:5000 still works from
# every node. Relative URLs keep upload Location headers valid behind TLS
# termination; the descriptor cache is set by env because
# /etc/docker/registry/config.yml on nuc-01 is not managed by this role.
- name: Inspect registry service spec
  ansible.builtin.command: docker service inspect registry --format '{% raw %}{{json .Spec}}{% endraw %}'
  register: registry_spec
  changed_when: false

- name: Add registry env (relative URLs, descriptor cache)
  ansible.builtin.command: >
    docker service update
    --env-add REGISTRY_HTTP_RELATIVEURLS=true
    --env-add REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR=inmemory
    registry
  when: "'REGISTRY_HTTP_RELATIVEURLS=true' not in registry_spec.stdout"
  changed_when: true

- name: Move registry port 5000 from host mode to ingress (existing service)
  ansible.builtin.command: >
    docker service update
    --publish-rm 5000
    --publish-add published=5000,target=5000
    registry
  when: >-
    '"PublishMode":"host"' in registry_spec.stdout
  changed_when: true

# --- Docker Registry Frontend ---

# joxit/docker-registry-ui in nginx proxy mode: the browser only talks to the UI,
# which proxies /v2 to the registry, so the registry needs no CORS headers. (The
# old konradkleine/docker-registry-frontend called the registry from the browser,
# was unmaintained, and listed nothing without CORS.) Both services join the
# `backend` overlay: a container can't reach the host's own published port by LAN
# IP, so the UI proxies to the registry by service name instead.
- name: Inspect registry-frontend service image
  ansible.builtin.command: docker service inspect registry-frontend --format '{% raw %}{{.Spec.TaskTemplate.ContainerSpec.Image}} {{join .Spec.TaskTemplate.ContainerSpec.Env " "}}{% endraw %}'
  register: registry_frontend_inspect
  changed_when: false
  failed_when: false

- name: Remove registry-frontend service (image or env changed)
  ansible.builtin.command: docker service rm registry-frontend
  when: registry_frontend_inspect.rc == 0 and (registry_frontend_desired | reject('in', registry_frontend_inspect.stdout) | list | length > 0)
  changed_when: true

- name: Create registry-frontend service
  ansible.builtin.command: >
    docker service create
    --name registry-frontend
    --network backend
    --publish published=5080,target=80
    --env SINGLE_REGISTRY=true
    --env REGISTRY_TITLE=Tradingo
    --env DELETE_IMAGES=true
    --env SHOW_CONTENT_DIGEST=true
    --env NGINX_PROXY_PASS_URL={{ registry_frontend_proxy }}
    --constraint 'node.hostname == nuc-01'
    --limit-memory 128M
    --restart-condition on-failure
    {{ registry_frontend_image }}
  when: registry_frontend_inspect.rc != 0 or (registry_frontend_desired | reject('in', registry_frontend_inspect.stdout) | list | length > 0)
  changed_when: true

- name: Check registry services' networks
  ansible.builtin.command: docker service inspect {{ item }} --format '{% raw %}{{range .Spec.TaskTemplate.Networks}}{{.Target}} {{end}}{% endraw %}'
  loop: [registry, registry-frontend]
  register: registry_nets
  changed_when: false

- name: Attach registry services to backend overlay (existing services)
  ansible.builtin.command: docker service update --network-add backend {{ item.item }}
  loop: "{{ registry_nets.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | trim | length == 0
  changed_when: true

# --- regctl (registry CLI) and pruning script ---

- name: Install regctl
  ansible.builtin.get_url:
    url: "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64"
    dest: /usr/local/bin/regctl
    mode: "0755"
  register: regctl_install

- name: Configure regctl for local insecure registry
  ansible.builtin.command: regctl registry set --tls disabled localhost:5000
  changed_when: true
  failed_when: false

- name: Configure regctl for insecure registry by IP
  ansible.builtin.command: regctl registry set --tls disabled {{ registry_host }}
  changed_when: true
  failed_when: false

  # FIXME this is required on the nuc-01/elected registry host
- name: Install registry prune script
  ansible.builtin.copy:
    src: registry-prune.sh
    dest: /usr/local/bin/registry-prune
    mode: "0755"
