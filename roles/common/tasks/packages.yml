---
# roles/common/tasks/packages.yml

- name: Check internet connectivity before apt update
  ansible.builtin.uri:
    url: http://archive.ubuntu.com
    timeout: 5
  register: net_check
  failed_when: false
  changed_when: false

- name: Fail fast if this node has no internet route
  ansible.builtin.fail:
    msg: >
      {{ inventory_hostname }} ({{ ansible_host | default('unknown') }}) cannot reach
      archive.ubuntu.com. Check the switch's uplink to the router, the default
      route (network_gateway), and DNS (dns_servers) before retrying apt.
  when: net_check.status is not defined or net_check.status != 200

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: safe
  when: ansible_run_tags is not defined or 'packages' in ansible_run_tags

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - nfs-common
      - wireguard
      - htop
      - iotop
      - tmux
      - jq
      - git
      - unzip
      - net-tools
      - python3
      - python3-pip
      - fail2ban
    state: present
