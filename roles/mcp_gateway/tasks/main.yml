---
# roles/mcp_gateway/tasks/main.yml

- name: Remove mcp-gateway
  when: mcp_gateway_state == "absent"
  block:
    - name: Turn off Tailscale Funnel
      ansible.builtin.command: tailscale funnel --https=443 off
      register: funnel_off
      failed_when: false
      changed_when: funnel_off.rc == 0

    - name: Remove mcp-gateway stack
      ansible.builtin.command: docker stack rm mcp-gateway
      register: stack_rm
      failed_when: stack_rm.rc != 0 and 'not found' not in stack_rm.stderr
      changed_when: stack_rm.rc == 0

    - name: Remove config directory
      ansible.builtin.file:
        path: "{{ mcp_gateway_config_dir }}"
        state: absent

- name: Deploy mcp-gateway
  when: mcp_gateway_state == "present"
  block:
    - name: Verify required secrets exist (run setup-mcp-gateway.yml first)
      ansible.builtin.command: "docker secret inspect {{ item }}"
      loop: >-
        {{ ['mcp_gateway_github_client_id', 'mcp_gateway_github_client_secret', 'mcp_gateway_jwt_key', 'mcp_gateway_tailscale_authkey']
           + (['docker_mcp_access_token'] if mcp_gateway_expose_docker else []) }}
      changed_when: false

    - name: Create config directory
      ansible.builtin.file:
        path: "{{ mcp_gateway_config_dir }}"
        state: directory
        mode: "0755"

    - name: Copy image build files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ mcp_gateway_config_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - Dockerfile
        - requirements.txt
        - gateway.py

    - name: Build mcp-gateway image
      ansible.builtin.command:
        cmd: docker build -t {{ mcp_gateway_image }} {{ mcp_gateway_config_dir }}
      changed_when: true

    - name: Push image to registry
      ansible.builtin.command:
        cmd: docker push {{ mcp_gateway_image }}
      changed_when: true

    - name: Template Tailscale serve config for the sidecar
      ansible.builtin.template:
        src: tailscale-serve.json.j2
        dest: "{{ mcp_gateway_config_dir }}/tailscale-serve.json"
        mode: "0644"

    - name: Template mcp-gateway stack file
      ansible.builtin.template:
        src: mcp-gateway-stack.yml.j2
        dest: "{{ mcp_gateway_config_dir }}/mcp-gateway-stack.yml"
        mode: "0644"

    - name: Deploy mcp-gateway stack
      ansible.builtin.command:
        cmd: >
          docker stack deploy
          -c {{ mcp_gateway_config_dir }}/mcp-gateway-stack.yml
          mcp-gateway
      changed_when: true

    # The image tag is :latest, so force a rolling restart to pick up a rebuild.
    - name: Restart service to pick up the new image
      ansible.builtin.command:
        cmd: docker service update --force --image {{ mcp_gateway_image }} mcp-gateway_mcp-gateway
      changed_when: true

    - name: Wait for gateway health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mcp_gateway_port }}/healthz"
        return_content: true
      register: gateway_health
      until: gateway_health.status == 200
      retries: 30
      delay: 3

    - name: Show gateway backends
      ansible.builtin.debug:
        msg: "{{ gateway_health.json }}"

    # Earlier versions exposed the gateway through Funnel on the nuc-05 node
    # itself. Make sure that public path is gone: nuc-05 must be tailnet-only.
    - name: Turn off the host-level Tailscale Funnel
      ansible.builtin.command: tailscale funnel --https=443 off
      register: funnel_off
      failed_when: false
      changed_when: funnel_off.rc == 0

    - name: Show connector URLs
      ansible.builtin.debug:
        msg: >-
          {{ ['Public (Funnel ' ~ ('on' if mcp_gateway_funnel | bool else 'off, tailnet only') ~ '): ' ~ mcp_gateway_public_url,
              'The tailscale sidecar needs ~30s to join the tailnet. If the URL does not answer, check:',
              '  docker service logs mcp-gateway_tailscale',
              '(auth key tagged ' ~ mcp_gateway_tailscale_tag ~ ' and the `funnel` nodeAttr for that tag).',
              '', 'Add these as custom connectors in Claude:']
             + (gateway_health.json.backends | map('regex_replace', '^(.*)$', mcp_gateway_public_url ~ '/\1/mcp') | list) }}
