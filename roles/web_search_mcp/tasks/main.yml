---
# roles/web_search_mcp/tasks/main.yml

- name: Remove web-search-mcp stack
  when: web_search_mcp_state == "absent"
  block:
    - name: Remove web-search-mcp stack
      ansible.builtin.command: docker stack rm web-search-mcp
      register: stack_rm
      failed_when: stack_rm.rc != 0 and 'not found' not in stack_rm.stderr
      changed_when: stack_rm.rc == 0

    - name: Remove config directory
      ansible.builtin.file:
        path: "{{ web_search_mcp_config_dir }}"
        state: absent

- name: Deploy web-search-mcp stack
  when: web_search_mcp_state == "present"
  block:
    - name: Create config directory
      ansible.builtin.file:
        path: "{{ web_search_mcp_config_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: Dockerfile
        dest: "{{ web_search_mcp_config_dir }}/Dockerfile"
        mode: "0644"

    - name: Copy run.py wrapper
      ansible.builtin.copy:
        src: run.py
        dest: "{{ web_search_mcp_config_dir }}/run.py"
        mode: "0644"

    - name: Build web-search-mcp image
      ansible.builtin.command:
        cmd: docker build -t {{ web_search_mcp_image }} {{ web_search_mcp_config_dir }}
      changed_when: true

    - name: Push image to registry
      ansible.builtin.command:
        cmd: docker push {{ web_search_mcp_image }}
      changed_when: true

    - name: Template web-search-mcp stack compose file
      ansible.builtin.template:
        src: web-search-mcp-stack.yml.j2
        dest: "{{ web_search_mcp_config_dir }}/web-search-mcp-stack.yml"
        mode: "0644"

    - name: Deploy web-search-mcp stack
      ansible.builtin.command:
        cmd: >
          docker stack deploy
          -c {{ web_search_mcp_config_dir }}/web-search-mcp-stack.yml
          web-search-mcp
      changed_when: true

    - name: Wait for service to start
      ansible.builtin.command:
        cmd: docker stack services web-search-mcp --format "{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.Replicas{{ '}}' }}"
      register: mcp_services
      changed_when: false

    - name: Show service status
      ansible.builtin.debug:
        msg: "{{ mcp_services.stdout_lines }}"