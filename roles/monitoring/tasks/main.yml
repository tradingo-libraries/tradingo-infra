---
# roles/monitoring/tasks/main.yml

- name: Remove monitoring stack
  when: monitoring_state == "absent"
  block:
    - name: Remove monitoring stack
      ansible.builtin.command: docker stack rm monitoring
      register: stack_rm
      failed_when: stack_rm.rc != 0 and 'not found' not in stack_rm.stderr
      changed_when: stack_rm.rc == 0

    - name: Remove config directory
      ansible.builtin.file:
        path: "{{ monitoring_config_dir }}"
        state: absent

- name: Allow Prometheus container to scrape docker-engine on manager
  when: monitoring_state == "present" and inventory_hostname in groups['managers']
  ansible.builtin.iptables:
    chain: INPUT
    source: "{{ monitoring_overlay_subnet }}"
    protocol: tcp
    destination_port: "9323"
    jump: ACCEPT
    comment: "Allow Prometheus overlay network to scrape docker-engine"

- name: Install iptables-persistent for rule persistence
  when: monitoring_state == "present" and inventory_hostname in groups['managers']
  ansible.builtin.apt:
    name: iptables-persistent
    state: present

- name: Persist iptables rules
  when: monitoring_state == "present" and inventory_hostname in groups['managers']
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
  changed_when: false

- name: Create node_exporter textfile collector directory on all swarm nodes
  when: monitoring_state == "present"
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    mode: "0755"
  delegate_to: "{{ item }}"
  loop: "{{ groups['swarm'] }}"

- name: Deploy Docker Swarm update status script
  when: monitoring_state == "present" and inventory_hostname in groups['managers']
  ansible.builtin.copy:
    src: docker-swarm-update-status.sh
    dest: /usr/local/bin/docker-swarm-update-status.sh
    mode: "0755"
  notify: Restart docker-swarm-update-status timer

- name: Deploy Docker Swarm update status systemd service
  when: monitoring_state == "present" and inventory_hostname in groups['managers']
  ansible.builtin.copy:
    src: docker-swarm-update-status.service
    dest: /etc/systemd/system/docker-swarm-update-status.service
    mode: "0644"
  notify: Restart docker-swarm-update-status timer

- name: Deploy Docker Swarm update status systemd timer
  when: monitoring_state == "present" and inventory_hostname in groups['managers']
  ansible.builtin.copy:
    src: docker-swarm-update-status.timer
    dest: /etc/systemd/system/docker-swarm-update-status.timer
    mode: "0644"
  notify: Restart docker-swarm-update-status timer

- name: Enable and start Docker Swarm update status timer
  when: monitoring_state == "present" and inventory_hostname in groups['managers']
  ansible.builtin.systemd:
    name: docker-swarm-update-status.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy monitoring stack
  when: monitoring_state == "present"
  block:
    - name: Create config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ monitoring_config_dir }}"
        - "{{ monitoring_config_dir }}/grafana/datasources"
        - "{{ monitoring_config_dir }}/grafana/dashboards"
        - "{{ monitoring_config_dir }}/grafana/dashboard-json"

    - name: Template Prometheus config
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ monitoring_config_dir }}/prometheus.yml"
        mode: "0644"

    - name: Template Grafana datasource provisioning
      ansible.builtin.template:
        src: datasource.yml.j2
        dest: "{{ monitoring_config_dir }}/grafana/datasources/datasource.yml"
        mode: "0644"

    - name: Template Grafana dashboard provisioning
      ansible.builtin.template:
        src: dashboards.yml.j2
        dest: "{{ monitoring_config_dir }}/grafana/dashboards/dashboards.yml"
        mode: "0644"

    - name: Copy Grafana dashboard JSON files
      ansible.builtin.copy:
        src: "dashboards/{{ item }}"
        dest: "{{ monitoring_config_dir }}/grafana/dashboard-json/{{ item }}"
        mode: "0644"
      loop:
        - node-exporter.json
        - docker-swarm.json
        - minio.json
        - flower.json
        - logs.json
        - postgres.json
        - tempo.json

    - name: Create polymarket dashboard directory
      ansible.builtin.file:
        path: "{{ monitoring_config_dir }}/grafana/dashboard-json/polymarket"
        state: directory
        mode: "0755"

    - name: Copy polymarket dashboard JSON
      ansible.builtin.copy:
        src: dashboards/polymarket.json
        dest: "{{ monitoring_config_dir }}/grafana/dashboard-json/polymarket/polymarket.json"
        mode: "0644"

    - name: Template Loki config
      ansible.builtin.template:
        src: loki.yml.j2
        dest: "{{ monitoring_config_dir }}/loki.yml"
        mode: "0644"

    - name: Template Tempo config
      ansible.builtin.template:
        src: tempo.yml.j2
        dest: "{{ monitoring_config_dir }}/tempo.yml"
        mode: "0644"

    - name: Template Promtail config
      ansible.builtin.template:
        src: promtail.yml.j2
        dest: "{{ monitoring_config_dir }}/promtail.yml"
        mode: "0644"

    - name: Template monitoring stack compose file
      ansible.builtin.template:
        src: monitoring-stack.yml.j2
        dest: "{{ monitoring_config_dir }}/monitoring-stack.yml"
        mode: "0644"

    - name: Deploy monitoring stack
      ansible.builtin.command:
        cmd: >
          docker stack deploy
          -c {{ monitoring_config_dir }}/monitoring-stack.yml
          monitoring
      changed_when: true

    - name: Wait for services to start
      ansible.builtin.command:
        cmd: docker stack services monitoring --format "{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.Replicas{{ '}}' }}"
      register: monitoring_services
      changed_when: false

    - name: Show service status
      ansible.builtin.debug:
        msg: "{{ monitoring_services.stdout_lines }}"

    - name: Wait for Grafana API to be ready
      ansible.builtin.uri:
        url: "http://localhost:3000/api/health"
        status_code: 200
      register: _grafana_health
      until: _grafana_health.status == 200
      retries: 30
      delay: 5

    - name: Ensure mcp-client service account exists
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts"
        method: POST
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: mcp-client
          role: Viewer
        status_code: [200, 201, 400, 409]

    - name: Fetch mcp-client service account
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/search?query=mcp-client&limit=1"
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
      register: _sa

    - name: List existing tokens for mcp-client
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/{{ _sa.json.serviceAccounts[0].id }}/tokens"
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
      register: _tokens

    - name: Delete stale mcp-deploy token
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/{{ _sa.json.serviceAccounts[0].id }}/tokens/{{ item.id }}"
        method: DELETE
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: [200, 204]
      loop: "{{ _tokens.json | selectattr('name', 'equalto', 'mcp-deploy') | list }}"

    - name: Create fresh mcp-deploy token
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/{{ _sa.json.serviceAccounts[0].id }}/tokens"
        method: POST
        url_username: admin
        url_password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: mcp-deploy
        status_code: [200, 201]
      register: _token

    - name: Inject API key into grafana-mcp service
      ansible.builtin.command:
        cmd: "docker service update --env-add GRAFANA_API_KEY={{ _token.json.key }} monitoring_grafana-mcp"
      changed_when: true
