---
# roles/tailscale/defaults/main.yml
#
# Address convention (see README "Tailscale"):
#   MagicDNS name : <inventory_hostname>.<tailscale_tailnet>   e.g. nuc-05.tailfe5b8d.ts.net
#   Tailnet IP    : recorded per host as `tailscale_ip` in inventory/host_vars/
# The tailnet is owned by the GitHub identity that signed in to Tailscale, so
# every node must be joined by that same GitHub account (interactively, or via
# an auth key generated by it).

# Auth key from https://login.tailscale.com/admin/settings/keys (created while
# signed in with GitHub). Put it in group_vars/all.yml or a vault, never in git.
# If empty, the role prints a login URL per node and waits for you to
# authenticate with GitHub in a browser.
tailscale_authkey: ""

# Node name inside the tailnet — must equal the inventory hostname.
tailscale_hostname: "{{ inventory_hostname }}"

# Servers keep their own resolver config; MagicDNS is only needed on the
# operator's machine.
tailscale_accept_dns: false

# Extra flags appended to `tailscale up` on first join.
tailscale_extra_args: []

# Seconds to wait for a browser login when no auth key is supplied.
tailscale_login_timeout: 300
